<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Payment Successful</title> <style> body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0} .card{background:#fff;border-radius:20px;padding:2.5rem;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)} .icon{font-size:4rem;margin-bottom:1rem} h1{color:#10b981;margin:0 0 .5rem} p{color:#64748b;margin-bottom:1.5rem} .btn{display:inline-block;padding:.8rem 2rem;background:#2563eb;color:#fff;text-decoration:none;border-radius:10px;font-weight:600} </style> </head> <body> <div class="card"> <div class="icon">✅</div> <h1>Payment Successful!</h1> <p id="msg">Activating your plan...</p> <a href="index.html" class="btn">Go to Dashboard</a> </div> <script> const url=new URLSearchParams(location.search); const plan=url.get('plan'); const days=parseInt(url.get('days')); const email=decodeURIComponent(url.get('email')||''); if(plan&&days&&email){ const endDate=new Date(); endDate.setDate(endDate.getDate()+days); const sub={status:'active',startDate:new Date().toISOString(),endDate:endDate.toISOString(),plan:plan,paidDate:new Date().toISOString()}; localStorage.setItem('invoice_sub_'+email,JSON.stringify(sub)); const AUTH_KEY='invoice_auth_users'; const users=JSON.parse(localStorage.getItem(AUTH_KEY)||'{}'); if(users[email]){ localStorage.setItem('invoice_auth_session',JSON.stringify({email:email,name:users[email].name||email,type:users[email].type||'email',loginTime:new Date().toISOString()})); } document.getElementById('msg').textContent='Your '+plan+' plan is active until '+endDate.toLocaleDateString('en-ZA'); }else{ document.getElementById('msg').textContent='Invalid return parameters.'; } </script> </body> </html>
